            ],

                { id: 'mercadopago', nombre: 'Mercado Pago', color: '#009EE3', cuentas: { debito: { balance: 1050 }, meliDolar: { balance: 0 }, credito: { activa: true, limite: 75000, deudaAlCorte: 2826, gastosPostCorte: 1642.32, fechaCorte: 21, fechaPago: 1, pagado: false, msi: [ { concepto: 'Compra 1', mensualidad: 98.92, mesesRestantes: 2 }, { concepto: 'Compra 2', mensualidad: 178.93, mesesRestantes: 4 }, { concepto: 'Compra 3', mensualidad: 65.86, mesesRestantes: 4 }, { concepto: 'Compra 4', mensualidad: 70.27, mesesRestantes: 3 }, { concepto: 'Compra 5', mensualidad: 48.66, mesesRestantes: 14 } ], transacciones: [{ concepto: 'Calimax', monto: 1642.32 }] } } },
                { id: 'bbva', nombre: 'BBVA', color: '#004481', cuentas: { debito: { balance: 0 }, credito: { activa: true, limite: 160800, deudaAlCorte: 6188.61, gastosPostCorte: 344, fechaCorte: 20, fechaPago: 9, pagado: false, msi: [{ concepto: 'Préstamo Actual', mensualidad: 1001, mesesRestantes: 3 }, { concepto: 'Nuevo Préstamo', mensualidad: 1100, mesesRestantes: 24 }], transacciones: [{ concepto: 'Cine', monto: 176 }, { concepto: 'Café', monto: 168 }] } } },
                { id: 'rappi', nombre: 'RappiCard', color: '#FF4600', cuentas: { credito: { activa: true, limite: 99635, deudaAlCorte: 2117.08, gastosPostCorte: 365, fechaCorte: 21, fechaPago: 10, pagado: false, msi: [], transacciones: [{ concepto: 'Agua', monto: 30 }, { concepto: 'Home Depot', monto: 86 }, { concepto: 'Pabellón', monto: 97 }, { concepto: 'Comida', monto: 152 }] } } },
                { id: 'vexi', nombre: 'Vexi', color: '#00C2A8', cuentas: { credito: { activa: true, limite: 10107.15, deudaAlCorte: 0, gastosPostCorte: 4012.09, fechaCorte: 3, fechaPago: 18, pagado: true, msi: [{ concepto: 'Compra A', mensualidad: 41.58, mesesRestantes: 3 }, { concepto: 'Compra B', mensualidad: 92.55, mesesRestantes: 5 }, { concepto: 'Compra C', mensualidad: 14.24, mesesRestantes: 3 }], transacciones: [{ concepto: 'Petco', monto: 1304 }, { concepto: 'Gasolina', monto: 888.53 }, { concepto: 'Shein', monto: 649.4 }] } } },
                { id: 'citibanamex', nombre: 'Citibanamex', color: '#002D72', cuentas: { credito: { activa: true, limite: 39616.67, deudaAlCorte: 0, gastosPostCorte: 3924.18, fechaCorte: 13, fechaPago: 2, pagado: true, msi: [{ concepto: 'MSI 1', mensualidad: 50, mesesRestantes: 3 }, { concepto: 'MSI 2', mensualidad: 50, mesesRestantes: 2 }, { concepto: 'MSI 3', mensualidad: 10, mesesRestantes: 1 }, { concepto: 'MSI 4', mensualidad: 346.34, mesesRestantes: 1 }, { concepto: 'MSI 5', mensualidad: 66.67, mesesRestantes: 3 }, { concepto: 'MSI 6', mensualidad: 50, mesesRestantes: 3 }], transacciones: [{ concepto: 'Mercado Pago', monto: 1197.11 }, { concepto: 'Calimax', monto: 1677.07 }] } } },
                { id: 'nu', nombre: 'Nu', color: '#8A05BE', cuentas: { debito: { balance: 0 }, credito: { activa: true, limite: 16000, deudaAlCorte: 0, gastosPostCorte: 80, fechaCorte: 17, fechaPago: 1, pagado: true, msi: [], transacciones: [{ concepto: 'Tienda', monto: 80 }] } } },
                { id: 'falabella', nombre: 'Falabella', color: '#B2D235', cuentas: { debito: { balance: 122 }, credito: { activa: true, limite: 90139.37, deudaAlCorte: 0, gastosPostCorte: 1386, fechaCorte: 16, fechaPago: 6, pagado: true, msi: [], transacciones: [{ concepto: 'Gasolina', monto: 625.4 }, { concepto: 'Minisu', monto: 329.6 }] } } }
            ]
        };

        let finanzas = {};
        let historialAcciones = [];
        let undoStack = [];
        window.deudaAcumuladaProyectada = 0;

        // --- PERSISTENCIA Y SINCRONIZACIÓN EN LA NUBE ---
        function initFirebase() {
            db.ref('appData').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    finanzas = data.finanzas || JSON.parse(JSON.stringify(DEFAULT_FINANZAS));
                    
                    // PARCHE DE FIREBASE: Reconstruir arreglos vacíos que Firebase elimina automáticamente
                    if (!finanzas.gastosSemanalesFijos) finanzas.gastosSemanalesFijos = [];
                    if (finanzas.plataformas) {
                        finanzas.plataformas.forEach(p => {
                            if (p.cuentas.credito) {
                                if (!p.cuentas.credito.msi) p.cuentas.credito.msi = [];
                                if (!p.cuentas.credito.transacciones) p.cuentas.credito.transacciones = [];
                            }
                        });
                    }
                    
                    historialAcciones = data.historial || [];
                    undoStack = data.undo || [];
                } else {
                    finanzas = JSON.parse(JSON.stringify(DEFAULT_FINANZAS));
                    historialAcciones = [];
                    undoStack = [];
                    saveData(); 
                }
                actualizarBotonDeshacer();
                renderUI(); 
            });
        }

        function saveData() {
            db.ref('appData').set({
                finanzas: finanzas,
                historial: historialAcciones,
                undo: undoStack
            });
        }

        // --- SISTEMA DESHACER ---
        function guardarSnapshot() {
            undoStack.push(JSON.stringify(finanzas));
            if (undoStack.length > 20) undoStack.shift(); 
            actualizarBotonDeshacer();
        }

        function deshacerAccion() {
            if(undoStack.length > 0) {
                let lastState = undoStack.pop();
                finanzas = JSON.parse(lastState);
                actualizarBotonDeshacer();
                registrarAccion("Se deshizo la última acción ↩️"); 
            }
        }

        function actualizarBotonDeshacer() {
            const btn = document.getElementById('btnUndo');
            if(undoStack.length > 0) btn.classList.remove('hidden');
            else btn.classList.add('hidden');
        }

        function registrarAccion(descripcion) {
            const now = new Date();
            const fechaTxt = now.toLocaleDateString('es-MX') + ' ' + now.toLocaleTimeString('es-MX', {hour: '2-digit', minute:'2-digit'});
            historialAcciones.push({ fecha: fechaTxt, desc: descripcion });
            saveData(); 
        }

        // --- SISTEMA DE RESPALDO (CONECTADO A FIREBASE) ---
        function descargarRespaldo() {
            const data = { finanzas: finanzas, historial: historialAcciones, undo: undoStack };
            const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const fecha = new Date().toISOString().split('T')[0];
            a.href = url;
            a.download = `Respaldo_Finanzas_${fecha}.json`;
            a.click();
            URL.revokeObjectURL(url);
            registrarAccion("Se descargó una copia de seguridad manual.");
        }

        function activarSubida() {
            document.getElementById('fileRespaldo').click();
        }

        function cargarRespaldo(event) {
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if(data.finanzas) {
                        db.ref('appData').set({
                            finanzas: data.finanzas,
                            historial: data.historial || [],
                            undo: data.undo || []
                        }).then(() => {
                            alert("¡Respaldo subido a la Nube con éxito! Todos tus dispositivos se actualizarán al instante.");
                            document.getElementById('fileRespaldo').value = "";
                        });
                    } else {
                        alert("El archivo seleccionado no tiene el formato de finanzas correcto.");
                    }
                } catch(err) {
                    alert("Error al leer el archivo. Asegúrate de que sea el archivo .json descargado previamente.");
                }
            };
            reader.readAsText(file);
        }

        // --- IA GEMINI INTEGRATION ---
        function configurarAPIKey() {
            let actual = localStorage.getItem('geminiApiKey') || '';
            let promptText = "Ingresa tu API Key de Gemini (Déjalo en blanco para borrar la actual):";
            let key = prompt(promptText, actual);
            if (key !== null) {
                localStorage.setItem('geminiApiKey', key.trim());
                if(key.trim() !== '') alert("API Key guardada exitosamente. ¡La IA está lista!");
            }
        }

        async function procesarComandoIA() {
            const input = document.getElementById('aiCommand');
            const btn = document.getElementById('btnSendIA');
            const comando = input.value.trim();
            if(!comando) return;

            let apiKey = localStorage.getItem('geminiApiKey');
            if(!apiKey) {
                apiKey = prompt("Para usar la IA, ingresa tu API Key de Gemini (se obtiene gratis en Google AI Studio):");
                if(!apiKey) return;
                localStorage.setItem('geminiApiKey', apiKey.trim());
            }

            input.disabled = true;
            btn.disabled = true;
            let tempValue = input.value;
            input.value = "Pensando...";
            btn.innerHTML = "⏳";

            const tarjetasValidas = finanzas.plataformas.map(p => `'${p.id}'`).join(', ');

            const promptText = `
                Eres un asistente financiero estricto. El usuario te dará una orden y debes devolver SOLO un arreglo JSON con las acciones.
                IDs de tarjetas válidos permitidos: ${tarjetasValidas}.
                Tipos de origen/destino permitidos: 'efectivo', 'debito', 'meli', 'credito'.

                Formatos obligatorios de los objetos dentro del arreglo JSON (usa exactamente estos 'action'):
                - Añadir a efectivo físico: {"action": "ingreso_efectivo", "monto": N}
                - Gastar de efectivo físico: {"action": "gasto_efectivo", "monto": N, "concepto": "X"}
                - Depositar a Débito: {"action": "deposito_debito", "tarjeta_id": "ID", "monto": N}
                - Depositar a Meli: {"action": "deposito_meli", "tarjeta_id": "ID", "monto": N}
                - Transferir (entre cuentas): {"action": "transferencia", "origen_tipo": "TIPO", "origen_id": "ID", "destino_tipo": "TIPO", "destino_id": "ID", "monto": N} (Si es desde/hacia efectivo físico usa "origen_id":"efectivo")
                - Gastar con tarjeta Crédito: {"action": "gasto_credito", "tarjeta_id": "ID", "monto": N, "concepto": "X"}
                - Compra a MSI: {"action": "compra_msi", "tarjeta_id": "ID", "monto": N, "concepto": "X", "meses": N}
                - Pagar deuda de tarjeta de crédito: {"action": "pago_deuda", "tarjeta_id": "ID_CREDITO_A_PAGAR", "origen_tipo": "TIPO_FONDOS", "origen_id": "ID_FONDOS", "monto": N}

                Comando del usuario: "${comando}"

                IMPORTANTE: Devuelve exclusivamente el texto JSON Array sin corchetes de markdown \`\`\`.
            `;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ role: 'user', parts: [{ text: promptText }] }],
                        generationConfig: { response_mime_type: "application/json", temperature: 0.1 }
                    })
                });

                const data = await response.json();
                if(data.error) throw new Error(data.error.message);

                const jsonStr = data.candidates[0].content.parts[0].text;
                let actions = JSON.parse(jsonStr);
                
                ejecutarAccionesIA(actions);
                input.value = "";
            } catch (error) {
                alert("Error con la IA: " + error.message + "\n\nSi es un error de API, asegúrate de que tu llave es válida.");
                input.value = tempValue;
            } finally {
                input.disabled = false;
                btn.disabled = false;
                btn.innerHTML = "Ejecutar";
            }
        }

        function ejecutarAccionesIA(acciones) {
            guardarSnapshot();
            let descripciones = [];
            let huboError = false;

            acciones.forEach(act => {
                try {
                    if (act.action === 'ingreso_efectivo') {
                        finanzas.efectivoEnMano += act.monto;
                        descripciones.push(`IA: Ingreso de ${formatC(act.monto)} a Efectivo.`);
                    } 
                    else if (act.action === 'gasto_efectivo') {
                        finanzas.efectivoEnMano -= act.monto;
                        descripciones.push(`IA: Gasto en efectivo (${act.concepto}) por ${formatC(act.monto)}.`);
                    } 
                    else if (act.action === 'deposito_debito') {
                        let card = finanzas.plataformas.find(p => p.id === act.tarjeta_id);
                        card.cuentas.debito.balance += act.monto;
                        descripciones.push(`IA: Depósito de ${formatC(act.monto)} en Débito de ${card.nombre}.`);
                    } 
                    else if (act.action === 'deposito_meli') {
                        let card = finanzas.plataformas.find(p => p.id === act.tarjeta_id);
                        card.cuentas.meliDolar.balance += act.monto;
                        descripciones.push(`IA: Depósito de ${formatC(act.monto)} en Meli Dólar de ${card.nombre}.`);
                    } 
                    else if (act.action === 'transferencia') {
                        if(act.origen_tipo === 'efectivo') finanzas.efectivoEnMano -= act.monto;
                        else {
                            let cardOrig = finanzas.plataformas.find(p => p.id === act.origen_id);
                            if(act.origen_tipo === 'debito') cardOrig.cuentas.debito.balance -= act.monto;
                            else if(act.origen_tipo === 'meli') cardOrig.cuentas.meliDolar.balance -= act.monto;
                        }
                        if(act.destino_tipo === 'efectivo') finanzas.efectivoEnMano += act.monto;
                        else {
                            let cardDest = finanzas.plataformas.find(p => p.id === act.destino_id);
                            if(act.destino_tipo === 'debito') cardDest.cuentas.debito.balance += act.monto;
                            else if(act.destino_tipo === 'meli') cardDest.cuentas.meliDolar.balance += act.monto;
                            else if(act.destino_tipo === 'credito') applyPaymentToCredit(cardDest, act.monto);
                        }
                        descripciones.push(`IA: Transferencia de ${formatC(act.monto)}.`);
                    } 
                    else if (act.action === 'gasto_credito') {
                        let card = finanzas.plataformas.find(p => p.id === act.tarjeta_id);
                        card.cuentas.credito.transacciones.push({ concepto: act.concepto, monto: act.monto });
                        card.cuentas.credito.gastosPostCorte += act.monto;
                        finanzas.gastosEspontaneosSemana += act.monto; 
                        descripciones.push(`IA: Gasto de ${formatC(act.monto)} en ${card.nombre} (${act.concepto}).`);
                    } 
                    else if (act.action === 'compra_msi') {
                        let card = finanzas.plataformas.find(p => p.id === act.tarjeta_id);
                        const mensualidad = act.monto / act.meses;
                        card.cuentas.credito.transacciones.push({ concepto: `${act.concepto} (${act.meses} MSI)`, monto: act.monto });
                        card.cuentas.credito.msi.push({ concepto: act.concepto, mensualidad: mensualidad, mesesRestantes: act.meses });
                        card.cuentas.credito.gastosPostCorte += (act.monto - mensualidad);
                        descripciones.push(`IA: Compra a ${act.meses} MSI en ${card.nombre} por ${formatC(act.monto)}.`);
                    } 
                    else if (act.action === 'pago_deuda') {
                        if(act.origen_tipo === 'efectivo') finanzas.efectivoEnMano -= act.monto;
                        else {
                            let cardOrig = finanzas.plataformas.find(p => p.id === act.origen_id);
                            if(act.origen_tipo === 'debito') cardOrig.cuentas.debito.balance -= act.monto;
                            else if(act.origen_tipo === 'meli') cardOrig.cuentas.meliDolar.balance -= act.monto;
                        }
                        let cardDest = finanzas.plataformas.find(p => p.id === act.tarjeta_id);
                        applyPaymentToCredit(cardDest, act.monto);
                        descripciones.push(`IA: Abono a deuda de ${cardDest.nombre} por ${formatC(act.monto)}.`);
                    }
                } catch (e) {
                    huboError = true;
                    console.error("Error procesando accion:", act, e);
                }
            });

            if (huboError) {
                alert("Hubo un pequeño error al aplicar parte de los datos. Revisa el resultado o usa el botón 'Deshacer'.");
            }
            if (descripciones.length > 0) registrarAccion(descripciones.join(" | "));
            else undoStack.pop(); 
        }

                let diffB = (cB.fechaCorte - currentDay + 30) % 30;

            const textElement = document.getElementById('sumatoriaPago');
            textElement.textContent = formatC(total);
            textElement.className = "text-xl font-black text-blue-400";
        }

        function openModal(type, cardId) {
            modalActionType = type;
            modalActiveCard = cardId;
            const baseCardId = cardId ? cardId.split('_')[0] : null; 
            const card = baseCardId ? finanzas.plataformas.find(p => p.id === baseCardId) : null;
            
            let title = '';
            let inputs = '';
            
            document.getElementById('modalSubmit').classList.remove('hidden');
            document.getElementById('btnCancel').textContent = 'Cancelar';

            if(type === 'historial_global') {
                title = 'Historial de Auditoría 🕒';
                inputs = historialAcciones.length === 0 ? `<p class="text-center text-gray-500 py-4">Aún no hay movimientos registrados.</p>` :
                    `<div class="space-y-3 max-h-[50vh] overflow-y-auto custom-scrollbar pr-2">` +
                    historialAcciones.slice().reverse().map(h => `
                        <div class="border-l-2 border-blue-500 pl-3 py-1 bg-gray-800 rounded-r">
                            <p class="text-[10px] text-gray-400 font-bold mb-0.5">${h.fecha}</p>

                document.getElementById('modalSubmit').classList.add('hidden');
                document.getElementById('btnCancel').textContent = 'Cerrar';

            else if(type === 'grafica') {

                let fijosSemanales = finanzas.gastosSemanalesFijos.reduce((sum, g) => sum + g.monto, 0);
                let disp = finanzas.ingresoSemanal - (msiSemanal + fijosSemanales) - finanzas.gastosEspontaneosSemana;
                
                let semanas = [];
                let maxDeuda = window.deudaAcumuladaProyectada;
                for(let i=0; i<4; i++) {
                    let proy = window.deudaAcumuladaProyectada - (disp * i);
                    if(proy < 0) proy = 0; 
                    if(proy > maxDeuda) maxDeuda = proy;
                    semanas.push(proy);
                }
                
                let barsHTML = semanas.map((val, i) => {
                    let height = maxDeuda > 0 ? (val / maxDeuda) * 100 : 0;
                    let color = disp >= 0 ? 'bg-green-500' : 'bg-red-500';
                    return `
                        <div class="flex flex-col items-center justify-end h-40">

                            <span class="text-xs font-bold mt-2 text-gray-400">Sem ${i+1}</span>

                    ? `<p class="text-sm text-green-400 font-bold mb-4 bg-green-900/30 p-2 rounded border border-green-800">¡Excelente ritmo! Tu deuda se reduce en ${formatC(disp)} por semana.</p>`

                inputs += `
                    </div>
                    <div class="mt-4 pt-3 border-t border-gray-700 flex justify-between items-center">
                        <span class="text-sm font-bold text-gray-400 uppercase">Abono Total:</span>
                        <span class="text-xl font-black text-gray-500 transition-colors" id="sumatoriaPago">$0.00</span>
                    </div>
                `;
            }
            else if (type === 'gasto') {
                title = `Nuevo gasto en ${card.nombre}`;
                inputs = `
                    <div class="mb-3">
                        <label for="conceptSelectionMode" class="block text-gray-300 text-sm font-bold mb-2">Seleccionar Concepto:</label>
                        <select id="conceptSelectionMode" class="w-full p-3 border rounded bg-gray-800 text-white border-gray-600">
                            <option value="manual">Ingresar manualmente</option>
                            <option value="fixed">Seleccionar de pagos fijos</option>
                        </select>
                    </div>
                    <div id="manualConceptInput">
                        <input type="text" id="inputConcepto" placeholder="¿En qué gastaste? (Ej. Cine)" class="w-full p-3 border rounded bg-gray-800 text-white border-gray-600 mb-3">
                    </div>
                    <div id="fixedConceptDropdown" class="hidden">
                        <select id="selectFixedExpense" class="w-full p-3 border rounded bg-gray-800 text-white border-gray-600 mb-3">
                            <option value="">-- Seleccionar pago fijo --</option>
                            ${finanzas.gastosSemanalesFijos.map(gasto => `<option value="${gasto.concepto}">${gasto.concepto}</option>`).join('')}
                        </select>
                    </div>
                    <input type="number" id="inputMonto" placeholder="Monto total del gasto" class="w-full p-3 border rounded bg-gray-800 text-white border-gray-600">
                    <p class="text-xs text-gray-500 mt-2">* Gastos de tu lista de básicos no afectarán tu Disponible Semanal.</p>`;

                setTimeout(() => { 
                    const mode = document.getElementById('conceptSelectionMode');
                    mode.addEventListener('change', (e) => {
                        if (e.target.value === 'manual') {
                            document.getElementById('manualConceptInput').classList.remove('hidden');
                            document.getElementById('fixedConceptDropdown').classList.add('hidden');
                            document.getElementById('inputConcepto').value = ''; 
                        } else {
                            document.getElementById('manualConceptInput').classList.add('hidden');
                            document.getElementById('fixedConceptDropdown').classList.remove('hidden');
                            document.getElementById('inputConcepto').value = document.getElementById('selectFixedExpense').value; 
                        }
                    });
                    document.getElementById('selectFixedExpense').addEventListener('change', (e) => {
                        document.getElementById('inputConcepto').value = e.target.value;
                    });
                }, 0);
            }
            else if (type === 'msi') {
                title = `Nueva compra a MSI en ${card.nombre}`;
                inputs = `
                    <input type="text" id="inputConcepto" placeholder="Concepto (Ej. Laptop)" class="w-full p-3 border rounded bg-gray-800 text-white border-gray-600 mb-3">
                    <input type="number" id="inputMonto" placeholder="Costo Total" class="w-full p-3 border rounded bg-gray-800 text-white border-gray-600 mb-3">
                    <select id="inputMeses" class="w-full p-3 border rounded bg-gray-800 text-white border-gray-600">
                        <option value="3">3 Meses</option><option value="6">6 Meses</option><option value="9">9 Meses</option>
                        <option value="12">12 Meses</option><option value="18">18 Meses</option><option value="24">24 Meses</option>
                    </select>`;
            }
            else if (type === 'detalle') {
                title = `Historial de ${card.nombre}`;
                let txs = card.cuentas.credito.transacciones;
                inputs = txs.length === 0 ? `<p class="text-center text-gray-500 py-4">Sin movimientos.</p>` :
                    txs.slice().reverse().map((t, index) => `
                        <div class="flex justify-between items-center py-2 border-b border-gray-700 last:border-0">
                            <span class="text-sm font-medium text-gray-300">${t.concepto}</span>
                            <div class="flex items-center space-x-2">
                                <span class="text-sm font-bold text-white">${formatC(t.monto)}</span>
                                <button onclick="deleteTransaction('${baseCardId}', ${txs.length - 1 - index})" class="text-red-500 hover:text-red-400 focus:outline-none p-1">
                                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1H9a1 1 0 00-1 1v3m-3 0h14"></path></svg>
                                </button>
                            </div>
                        </div>
                    `).join('');
                document.getElementById('modalSubmit').classList.add('hidden');
                document.getElementById('btnCancel').textContent = 'Cerrar';
            }
            else if (type === 'detalle_msi') {
                title = `MSI y Préstamos de ${card.nombre}`;
                let msi = card.cuentas.credito.msi;
                inputs = msi.length === 0 ? `<p class="text-center text-gray-500 py-4">No tienes deudas a meses aquí.</p>` :
                    msi.map((m, index) => `
                        <div class="flex justify-between items-center py-3 border-b border-gray-700 last:border-0">
                            <div>
                                <p class="text-sm font-bold text-gray-300">${m.concepto}</p>
                                <p class="text-[10px] text-gray-500">Restan ${m.mesesRestantes} pagos</p>
                            </div>
                            <div class="flex items-center space-x-3">
                                <span class="text-sm font-bold text-danger">${formatC(m.mensualidad)} /mes</span>
                                <button onclick="deleteMsiItem('${baseCardId}', ${index})" class="text-red-500 hover:text-red-400 focus:outline-none p-1">
                                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1H9a1 1 0 00-1 1v3m-3 0h14"></path></svg>
                                </button>
                            </div>
                        </div>
                    `).join('');
                document.getElementById('modalSubmit').classList.add('hidden');
                document.getElementById('btnCancel').textContent = 'Cerrar';
            }
            else if (type === 'editar_fijos') {
                title = "Gastos Básicos Semanales";
                inputs = `<div id="listaFijosContainer" class="space-y-2 mb-4">` +
                    finanzas.gastosSemanalesFijos.map((g, i) => `
                        <div class="flex gap-2 items-center">
                            <input type="text" id="fijoConcepto-${i}" value="${g.concepto}" disabled class="flex-1 p-2 border rounded text-sm bg-gray-900 text-gray-400 border-gray-700">
                            <input type="number" id="fijoMonto-${i}" value="${g.monto}" disabled class="w-24 p-2 border rounded text-sm bg-gray-900 text-gray-400 border-gray-700 text-right">
                            <button id="editFijoBtn-${i}" onclick="toggleEditFijo(${i})" class="text-blue-500 px-2 font-bold hover:text-blue-400 rounded transition">Editar</button>
                            <button onclick="eliminarFijo(${i})" class="text-red-500 px-2 font-bold hover:text-red-400 rounded transition">X</button>
                        </div>
                    `).join('') + `</div>
                    <div class="flex gap-2 items-center border-t pt-4 border-gray-700">
                        <input type="text" id="nuevoFijoNombre" placeholder="Nombre" class="flex-1 p-2 border rounded text-sm bg-gray-800 text-white focus:outline-none focus:ring-1 focus:ring-blue-500 border-gray-600">
                        <input type="number" id="nuevoFijoMonto" placeholder="$ Monto" class="w-24 p-2 border rounded text-sm bg-gray-800 text-white focus:outline-none focus:ring-1 focus:ring-blue-500 border-gray-600">
                        <button onclick="agregarFijo()" class="bg-green-600 hover:bg-green-500 text-white px-3 py-2 rounded text-sm font-bold transition">+</button>
                    </div>
                `;
                document.getElementById('modalSubmit').classList.add('hidden');
                document.getElementById('btnCancel').textContent = 'Cerrar Guardando';
            }

            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalInputs').innerHTML = inputs;
            if(type !== 'grafica' && type !== 'historial_global') document.getElementById('actionModal').classList.remove('hidden');
            else document.getElementById('actionModal').classList.remove('hidden');
            
            document.getElementById('modalSubmit').onclick = executeAction;
        }

        function closeModal() {
            document.getElementById('actionModal').classList.add('hidden');
            renderUI();
        }

        function applyPaymentToCredit(card, amount) {
            let remaining = amount;
            if (card.cuentas.credito.deudaAlCorte > 0) {
                if (remaining >= card.cuentas.credito.deudaAlCorte) {
                    remaining -= card.cuentas.credito.deudaAlCorte;
                    card.cuentas.credito.deudaAlCorte = 0;
                } else {
                    card.cuentas.credito.deudaAlCorte -= remaining;
                    remaining = 0;
                }
            }
            if (remaining > 0 && card.cuentas.credito.gastosPostCorte > 0) {
                if (remaining >= card.cuentas.credito.gastosPostCorte) {
                    card.cuentas.credito.gastosPostCorte = 0;
                } else {
                    card.cuentas.credito.gastosPostCorte -= remaining;
                }
            }
            if (card.cuentas.credito.deudaAlCorte === 0) card.cuentas.credito.pagado = true;
        }

        function executeAction() {
            guardarSnapshot(); 
            const baseCardId = modalActiveCard ? modalActiveCard.split('_')[0] : null;
            const card = baseCardId ? finanzas.plataformas.find(p => p.id === baseCardId) : null;
            
            if (modalActionType === 'liquidez') {
                const monto = parseFloat(document.getElementById('inputMonto')?.value);
                if(!isNaN(monto) && monto > 0) {
                    finanzas.efectivoEnMano += monto;
                    registrarAccion(`Se ingresaron ${formatC(monto)} a Efectivo Físico.`);
                }
            }
            else if (modalActionType === 'restar_efectivo') {
                const monto = parseFloat(document.getElementById('inputMonto')?.value);
                const motivo = document.getElementById('inputMotivoEfectivo')?.value || 'Retiro de efectivo';
                if(!isNaN(monto) && monto > 0 && monto <= finanzas.efectivoEnMano) {
                    finanzas.efectivoEnMano -= monto;
                    registrarAccion(`Gasto en efectivo: ${motivo} por ${formatC(monto)}.`);
                } else {
                    undoStack.pop();
                    alert("Monto inválido o superior al efectivo que tienes en mano."); return;
                }
            }
            else if (modalActionType === 'debito') {
                const monto = parseFloat(document.getElementById('inputMonto')?.value);
                if(!isNaN(monto) && monto > 0) {
                    card.cuentas.debito.balance += monto;
                    registrarAccion(`Se depositaron ${formatC(monto)} en Débito de ${card.nombre}.`);
                }
            }
            else if (modalActionType === 'meli') {
                const monto = parseFloat(document.getElementById('inputMonto')?.value);
                if(!isNaN(monto) && monto > 0) {
                    card.cuentas.meliDolar.balance += monto;
                    registrarAccion(`Se ingresaron ${formatC(monto)} a Meli Dólar en ${card.nombre}.`);
                }
            }
            else if (modalActionType === 'transferir') {
                const monto = parseFloat(document.getElementById('inputMonto').value);
                const destId = document.getElementById('selectDestino').value;
                const sourceSubType = modalActiveCard.split('_')[1]; 
                
                let sourceBalance = sourceSubType === 'meli' ? card.cuentas.meliDolar.balance : card.cuentas.debito.balance;

                if (isNaN(monto) || monto <= 0) { undoStack.pop(); alert('Ingresa un monto válido.'); return; }
                if (monto > sourceBalance) { undoStack.pop(); alert('No tienes suficientes fondos.'); return; }

                if (sourceSubType === 'meli') card.cuentas.meliDolar.balance -= monto;
                else card.cuentas.debito.balance -= monto;

                const destBaseId = destId.split('_')[0];
                const destSubType = destId.split('_')[1]; 
                const destCard = finanzas.plataformas.find(p => p.id === destBaseId);
                const sourceName = sourceSubType === 'meli' ? `${card.nombre} (Meli Dólar)` : `${card.nombre} (Débito)`;

                if (destSubType === 'debito') {
                    destCard.cuentas.debito.balance += monto;
                    registrarAccion(`Transferencia de ${formatC(monto)} desde ${sourceName} hacia Débito de ${destCard.nombre}.`);
                }
                else if (destSubType === 'meli') {
                    destCard.cuentas.meliDolar.balance += monto;
                    registrarAccion(`Transferencia de ${formatC(monto)} desde ${sourceName} hacia Meli Dólar de ${destCard.nombre}.`);
                }
                else if (destSubType === 'credito') {
                    applyPaymentToCredit(destCard, monto);
                    registrarAccion(`Pago de deuda por ${formatC(monto)} a ${destCard.nombre} con fondos de ${sourceName}.`);
                }
            }
            else if (modalActionType === 'pagar') {
                let totalSuma = 0;
                let pagosDeducir = [];
                let errorFound = false;
                
                document.querySelectorAll('.payment-source').forEach(input => {
                    let val = parseFloat(input.value) || 0;
                    if(val > 0) {
                        let id = input.getAttribute('data-id'); 
                        let maxSaldo = parseFloat(input.getAttribute('data-max'));
                        if(val > maxSaldo) {
                            alert(`Error: Saldo insuficiente en la cuenta marcada.`);
                            errorFound = true;
                        }
                        totalSuma += val;
                        pagosDeducir.push({id: id, monto: val});
                    }
                });

                if (errorFound) { undoStack.pop(); return; }
                if (totalSuma <= 0) { undoStack.pop(); alert("Ingresa algún monto a pagar."); return; }
                
                let totalDeuda = card.cuentas.credito.deudaAlCorte + card.cuentas.credito.gastosPostCorte;
                if (totalSuma > totalDeuda) {
                    undoStack.pop();
                    alert(`El abono (${formatC(totalSuma)}) es mayor a tu deuda actual (${formatC(totalDeuda)}).`);
                    return;
                }

                let origenesUsados = [];

                pagosDeducir.forEach(pago => {
                    if (pago.id === 'efectivo') {
                        finanzas.efectivoEnMano -= pago.monto;
                        origenesUsados.push(`Efectivo (${formatC(pago.monto)})`);
                    } else {
                        let platId = pago.id.split('_')[0];
                        let subType = pago.id.split('_')[1];
                        let cuentaInfo = finanzas.plataformas.find(p => p.id === platId);
                        
                        if (subType === 'debito') {
                            cuentaInfo.cuentas.debito.balance -= pago.monto;
                            origenesUsados.push(`${cuentaInfo.nombre} Débito (${formatC(pago.monto)})`);
                        }
                        if (subType === 'meli') {
                            cuentaInfo.cuentas.meliDolar.balance -= pago.monto;
                            origenesUsados.push(`${cuentaInfo.nombre} Meli (${formatC(pago.monto)})`);
                        }
                    }
                });

                applyPaymentToCredit(card, totalSuma);
                registrarAccion(`Se abonó ${formatC(totalSuma)} a la deuda de ${card.nombre}. Fondos tomados de: ${origenesUsados.join(', ')}.`);
            }
            else {
                const monto = parseFloat(document.getElementById('inputMonto')?.value);
                if(isNaN(monto) || monto <= 0) { undoStack.pop(); alert('Ingresa un monto válido.'); return; }

                if (modalActionType === 'gasto') {
                    let concepto = document.getElementById('inputConcepto').value;
                    if (document.getElementById('conceptSelectionMode').value === 'fixed' && !concepto) {
                        concepto = document.getElementById('selectFixedExpense').value;
                    }
                    if(!concepto) concepto = 'Gasto Extra';

                    let c = card.cuentas.credito;
                    c.transacciones.push({ concepto: concepto, monto: monto });
                    c.gastosPostCorte += monto; 

                    const isPlanned = finanzas.gastosSemanalesFijos.some(g => concepto.toLowerCase().includes(g.concepto.toLowerCase()));
                    if (!isPlanned) { finanzas.gastosEspontaneosSemana += monto; }

                    registrarAccion(`Gasto registrado en ${card.nombre}: ${concepto} por ${formatC(monto)}.`);
                }
                else if (modalActionType === 'msi') {
                    let concepto = document.getElementById('inputConcepto').value || 'Compra a MSI';
                    const meses = parseInt(document.getElementById('inputMeses').value);
                    const mensualidad = monto / meses;
                    let c = card.cuentas.credito;

                    c.transacciones.push({ concepto: `${concepto} (${meses} MSI)`, monto: monto });
                    c.msi.push({ concepto: concepto, mensualidad: mensualidad, mesesRestantes: meses });
                    c.gastosPostCorte += (monto - mensualidad);

                    registrarAccion(`Compra a ${meses} MSI en ${card.nombre}: ${concepto} por ${formatC(monto)}.`);
                }
            }
            closeModal();
        }

        window.realizarCorte = function(cardId) {
            const card = finanzas.plataformas.find(p => p.id === cardId);
            let c = card.cuentas.credito;
            if(confirm(`¿Realizar corte para ${card.nombre}?\n\nEsto moverá tus Gastos Actuales a Deuda al Corte y avanzará un mes tus compras a MSI.`)) {
                guardarSnapshot();
                let msiMes = c.msi.reduce((acc, m) => acc + m.mensualidad, 0);
                c.deudaAlCorte += c.gastosPostCorte + msiMes;
                c.gastosPostCorte = 0;
                c.pagado = false;
                
                c.msi.forEach(m => m.mesesRestantes--);
                c.msi = c.msi.filter(m => m.mesesRestantes > 0);
                
                registrarAccion(`Corte mensual realizado en ${card.nombre}. Nueva deuda al corte: ${formatC(c.deudaAlCorte)}`);
            }
        }

        window.eliminarFijo = function(index) {
            if (confirm("¿Estás seguro de que quieres eliminar este gasto fijo?")) {
                guardarSnapshot();
                const nombre = finanzas.gastosSemanalesFijos[index].concepto;
                finanzas.gastosSemanalesFijos.splice(index, 1);
                registrarAccion(`Gasto básico eliminado: ${nombre}`);
                openModal('editar_fijos', null); 
            }
        }
        window.agregarFijo = function() {
            const nombre = document.getElementById('nuevoFijoNombre').value;
            const monto = parseFloat(document.getElementById('nuevoFijoMonto').value);
            if(nombre && !isNaN(monto) && monto > 0) {
                guardarSnapshot();
                finanzas.gastosSemanalesFijos.push({ concepto: nombre, monto: monto });
                registrarAccion(`Gasto básico agregado: ${nombre} por ${formatC(monto)}`);
                openModal('editar_fijos', null);
            } else { alert("Por favor, ingresa un nombre y monto válido."); }
        }
        window.toggleEditFijo = function(index) {
            const conceptoInput = document.getElementById(`fijoConcepto-${index}`);
            const montoInput = document.getElementById(`fijoMonto-${index}`);
            const editButton = document.getElementById(`editFijoBtn-${index}`);

            if (conceptoInput.disabled) { 
                conceptoInput.disabled = false;
                montoInput.disabled = false;
                editButton.textContent = 'Guardar';
                editButton.classList.remove('text-blue-500');
                editButton.classList.add('text-green-500');
            } else { 
                const nuevoConcepto = conceptoInput.value;
                const nuevoMonto = parseFloat(montoInput.value);

                if (nuevoConcepto && !isNaN(nuevoMonto) && nuevoMonto > 0) {
                    guardarSnapshot();
                    finanzas.gastosSemanalesFijos[index].concepto = nuevoConcepto;
                    finanzas.gastosSemanalesFijos[index].monto = nuevoMonto;
                    conceptoInput.disabled = true;
                    montoInput.disabled = true;
                    editButton.textContent = 'Editar';
                    editButton.classList.remove('text-green-500');
                    editButton.classList.add('text-blue-500');
                    registrarAccion(`Gasto básico modificado a: ${nuevoConcepto} por ${formatC(nuevoMonto)}`);
                } else {
                    alert("Por favor, ingresa un concepto y un monto válido.");
                }
            }
        }
        window.deleteMsiItem = function(cardId, msiIndex) {
            const card = finanzas.plataformas.find(p => p.id === cardId);
            const item = card.cuentas.credito.msi[msiIndex];
            if (confirm(`¿Eliminar la mensualidad de "${item.concepto}"?`)) {
                guardarSnapshot();
                card.cuentas.credito.msi.splice(msiIndex, 1);
                registrarAccion(`Se borró la deuda a MSI en ${card.nombre}: ${item.concepto}`);
                openModal('detalle_msi', cardId); 
            }
        }
        window.deleteTransaction = function(cardId, txIndex) {
            const card = finanzas.plataformas.find(p => p.id === cardId);
            const item = card.cuentas.credito.transacciones[txIndex];
            if (confirm(`¿Eliminar este registro del historial?`)) {
                guardarSnapshot();
                card.cuentas.credito.transacciones.splice(txIndex, 1);
                registrarAccion(`Se borró el gasto del historial en ${card.nombre}: ${item.concepto}`);
                openModal('detalle', cardId); 
            }
        }
        function resetGastosSemana() {
            if(confirm("¿Iniciar nueva semana? Esto reseteará tu dinero libre disponible.")) {
                guardarSnapshot();
                finanzas.gastosEspontaneosSemana = 0;
                registrarAccion("Presupuesto semanal reiniciado.");
            }
        }
        function editIngreso() {
            let nuevo = prompt("Ingreso semanal:", finanzas.ingresoSemanal);
            if (nuevo && !isNaN(nuevo)) { 
                guardarSnapshot();
                finanzas.ingresoSemanal = parseFloat(nuevo); 
                registrarAccion(`Ingreso semanal configurado a ${formatC(finanzas.ingresoSemanal)}`);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initFirebase();
        });
    </script>
</body>
</html>
